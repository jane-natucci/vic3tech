<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EU4 Tech – Countries at Every Start, Mission Trees, National Ideas and Unit Pips</title>
  <meta name="description" content="Europa Universalis IV read from the game files: every country at each start date (ruler and monarch points, provinces, development, rivals, allies, subjects), national ideas, mission trees, and how units get stronger by military tech.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://eu4tech.jane.berlin/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="EU4 Tech – Countries, Mission Trees, National Ideas and Unit Pips">
  <meta property="og:description" content="Every EU4 country at each start date, its national ideas and mission trees, plus unit pips by military tech and what adm, dip and mil tech add — straight from the game files.">
  <meta property="og:url" content="https://eu4tech.jane.berlin/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="EU4 Tech – Countries, Mission Trees, National Ideas and Unit Pips">
  <meta name="twitter:description" content="Every EU4 land unit's pips by military tech level, unit groups side by side, and what each adm, dip and mil tech adds.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f4efe4' stroke='%238a2c1f' stroke-width='2'/%3E%3Cdefs%3E%3Cg id='sword' fill='%238a2c1f'%3E%3Cpath d='M16 5.2l1.7 3v11.2h-3.4V8.2z'/%3E%3Crect x='11.4' y='19.4' width='9.2' height='1.9' rx='.9'/%3E%3Crect x='15.1' y='21.3' width='1.8' height='4.2'/%3E%3Ccircle cx='16' cy='26.4' r='1.5'/%3E%3C/g%3E%3C/defs%3E%3Cg transform='translate(16.05 15.4) scale(1.1) translate(-16 -16)'%3E%3Cuse href='%23sword' transform='rotate(45 16 16)'/%3E%3Cuse href='%23sword' transform='rotate(-45 16 16)' stroke='%23f4efe4' stroke-width='.7' paint-order='stroke'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Everything this page needs is in eu4tech/ (this file, extract.rb and the
       generated data.json), sharing nothing with the Vic3 page, so the
       folder can move to another app as is. -->
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe4; --panel: #fbf8f1; --ink: #231d14; --muted: #7a6d58; --line: #d9cfbc;
      --accent: #8a2c1f; --accent-soft: #f1ddd6;
      --fire: #c2562f; --shock: #3f6f9a; --morale: #6b7f4e;
      --s1: #8a2c1f; --s2: #2f6f9a; --s3: #6b7f4e; --s4: #b2803a; --s5: #6d4f82; --s6: #3d8b85;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #17140f; --panel: #201c16; --ink: #eee5d3; --muted: #a1937b; --line: #3a3228;
        --accent: #e0876f; --accent-soft: #3b231c;
        --fire: #e07a50; --shock: #79a8d4; --morale: #9fb57a;
        --s1: #e0876f; --s2: #79a8d4; --s3: #9fb57a; --s4: #d3a258; --s5: #b195c8; --s6: #6fc2bb;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 1.35em; }
    header h1 small { color: var(--muted); font-size: 0.7em; margin-left: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font: inherit; font-size: 0.88em; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 13px; border-radius: 999px; cursor: pointer; }
    .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chips.multi button.on { background: var(--accent-soft); color: var(--ink); border-color: var(--c, var(--accent)); box-shadow: inset 0 0 0 1px var(--c, var(--accent)); }
    .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); align-items: start; max-width: 1600px; margin: 0 auto; }
    main { padding: 18px 20px 60px; min-width: 0; }
    #side { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 14px 12px 20px 20px; border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #side select, #side input { width: 100%; font: inherit; font-size: 0.9em; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; margin: 0 0 8px; }
    #side .note { font-size: 0.8em; margin-bottom: 6px; }
    .country { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
    .country:hover { background: var(--accent-soft); }
    .country.pinned { background: var(--ink); color: var(--bg); }
    .country img, .flag { width: 26px; height: 26px; object-fit: contain; }
    .country .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .country .count { font-size: 0.78em; opacity: 0.7; font-variant-numeric: tabular-nums; }
    .country.later { opacity: 0.5; }
    .pick-btn { display: none; font: inherit; font-size: 0.88em; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 13px; border-radius: 999px; cursor: pointer; }
    @media (max-width: 860px) {
      .layout { display: block; }
      .pick-btn { display: inline-block; }
      #side { display: none; position: static; max-height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); }
      #side.open { display: block; }
    }

    /* Country pages */
    .chead { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .chead img { width: 64px; height: 64px; }
    .chead h2 { font-size: 1.6em; }
    .chead .sub { color: var(--muted); font-size: 0.9em; }
    .sections { margin: 12px 0 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
    .stat .k { color: var(--muted); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .v { font-size: 1.5em; font-family: Georgia, serif; font-variant-numeric: tabular-nums; }
    .stat .s { color: var(--muted); font-size: 0.82em; }
    .mana { display: inline-flex; gap: 8px; font-family: Georgia, serif; font-size: 1.5em; }
    .mana b { font-weight: normal; } .mana .a { color: var(--shock); } .mana .d { color: var(--accent); } .mana .m { color: var(--morale); }
    .bars { display: grid; gap: 4px; font-size: 0.86em; }
    .bar-row { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px; align-items: center; }
    .bar-row .b { height: 8px; border-radius: 4px; background: var(--accent); }
    .bar-row .b.t { background: var(--fire); } .bar-row .b.p { background: var(--shock); } .bar-row .b.m { background: var(--morale); }
    .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .tags a, a.tagl { color: var(--accent); cursor: pointer; text-decoration: none; }
    .tags a:hover, a.tagl:hover { text-decoration: underline; }
    .tags span.sep { color: var(--muted); }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 0.92em; }
    dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; }
    .tree-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; overflow: auto; max-height: 70vh; margin-bottom: 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tree-wrap h3 { font-size: 1em; margin: 2px 4px 6px; color: var(--muted); }
    .mnode rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; rx: 8; }
    .mnode { cursor: pointer; } .mnode:hover rect, .mnode.sel rect { stroke: var(--accent); }
    .mnode.sel rect { fill: var(--accent-soft); stroke-width: 2.5; }
    .mnode text { fill: var(--ink); font-size: 11px; text-anchor: middle; pointer-events: none; }
    .medge { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: 0.7; }
    #mdetail { position: sticky; bottom: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 16px; margin-top: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
    .idea { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
    .idea h3 { font-size: 1.02em; margin-bottom: 2px; }
    .idea .d { color: var(--muted); font-size: 0.82em; margin-bottom: 4px; font-style: italic; }
    .idea ul { margin: 0; padding-left: 1.1em; font-size: 0.9em; }
    .idea .n { color: var(--muted); font-size: 0.75em; }
    section { margin-bottom: 34px; }
    section > h2 { font-size: 1.3em; margin-bottom: 4px; }
    .note { color: var(--muted); font-size: 0.88em; margin-bottom: 12px; max-width: 900px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
    .card h3 { font-size: 1.05em; margin-bottom: 6px; }
    svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
    svg.chart text { fill: var(--muted); font-size: 10px; }
    svg.chart .grid line { stroke: var(--line); }
    svg.chart .series { fill: none; stroke-width: 2; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.82em; color: var(--muted); margin-top: 4px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

    /* Unit lanes: one row per unit, positioned on the mil tech axis. */
    .lanes { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 14px; overflow-x: auto; }
    .axis, .unit { display: grid; grid-template-columns: 360px repeat(33, minmax(14px, 1fr)); align-items: center; min-width: 900px; }
    .axis { font-size: 0.72em; color: var(--muted); position: sticky; top: 0; background: var(--panel); padding: 4px 0; border-bottom: 1px solid var(--line); }
    .axis span { text-align: center; }
    .lane-title { font-family: Georgia, serif; font-size: 1.05em; margin: 12px 0 2px; }
    .unit { padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 0.86em; }
    .unit .name { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 10px; }
    .unit .name .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unit .name small { color: var(--muted); }
    .unit .bar { height: 8px; border-radius: 4px; background: var(--line); }
    .unit.best .bar { background: var(--accent); }
    .unit.best .n { font-weight: 600; }
    .pipset { display: inline-grid; grid-template-columns: repeat(3, auto); gap: 1px 5px; font-size: 0.72em; line-height: 1; font-variant-numeric: tabular-nums; }
    .pipset b { font-weight: 600; }
    .pip-f { color: var(--fire); } .pip-s { color: var(--shock); } .pip-m { color: var(--morale); }
    .total { font-weight: 600; font-variant-numeric: tabular-nums; }
    .gain { color: var(--accent); font-size: 0.8em; }
    .key { font-size: 0.82em; color: var(--muted); margin: 6px 0 0; }

    table.levels { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    table.levels th, table.levels td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.levels th { color: var(--muted); font-weight: normal; }
    table.levels td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tag { display: inline-block; font-size: 0.85em; padding: 1px 7px; margin: 1px 2px; border-radius: 999px; background: var(--accent-soft); }
    .tag.eff { background: transparent; border: 1px solid var(--line); }
    .err { padding: 40px; color: var(--accent); }
    footer { max-width: 1280px; margin: 0 auto; padding: 0 20px 30px; font-size: 0.78em; color: var(--muted); }
    footer a { color: inherit; }
    @media (max-width: 760px) { header, main { padding-left: 12px; padding-right: 12px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>EU4 tech <small id="version"></small></h1>
    <div class="chips" id="tabs">
      <button data-tab="country">Country</button>
      <button data-tab="units" class="on">Military units</button>
      <button data-tab="tech">Adm / Dip / Mil tech</button>
    </div>
    <button type="button" id="pickBtn" class="pick-btn">Choose a country</button>
  </header>
  <div class="layout">
    <aside id="side" aria-label="Countries">
      <select id="dateSel" aria-label="Start date"></select>
      <input id="csearch" type="search" placeholder="Search any country…" autocomplete="off" aria-label="Search countries">
      <p class="note" id="sideHint"></p>
      <div id="countries"></div>
    </aside>
    <main id="app"></main>
  </div>
  <footer>Unofficial fan page. Data comes from the Europa Universalis IV game files<span id="footVersion"></span>; Europa Universalis IV is © Paradox Interactive.</footer>

  <script>
    const app = document.getElementById("app");
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const TYPES = ["infantry", "cavalry", "artillery"];
    const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"];
    const GROUP_NAMES = { western: "Western", eastern: "Eastern", ottoman: "Ottoman", muslim: "Muslim", indian: "Indian", chinese: "Chinese",
      sub_saharan: "Sub-Saharan", nomad_group: "Nomadic", mesoamerican: "Mesoamerican", south_american: "South American",
      north_american: "North American", high_american: "High American", aboriginal_tech: "Aboriginal", polynesian_tech: "Polynesian" };
    // Effects the game's localisation doesn't name (or names oddly).
    const EFFECT_NAMES = { infantry_fire: "Infantry fire", infantry_shock: "Infantry shock", cavalry_fire: "Cavalry fire", cavalry_shock: "Cavalry shock",
      artillery_fire: "Artillery fire", artillery_shock: "Artillery shock", land_morale: "Land morale", military_tactics: "Military tactics",
      combat_width: "Combat width", maneuver_value: "Maneuver", supply_limit: "Supply limit", sprite_level: "Unit sprite level",
      naval_morale: "Naval morale", range: "Colonial range", trade_range: "Trade range", global_colonial_growth: "Colonial growth",
      naval_engagement_width: "Naval engagement width", governing_capacity: "Governing capacity", allowed_idea_groups: "Idea groups",
      administrative_efficiency: "Administrative efficiency", development_cost_modifier: "Development cost" };
    const PERCENT = /efficiency|modifier|maintenance/;
    const state = { tab: "units", group: "western", compare: ["western", "eastern", "ottoman", "muslim"], tag: null, section: "overview", date: null };
    let CD = null, MD = null, ID = null, cBy = {}; // countries, missions and ideas data
    let D, NAMES;

    // Compared groups get colours by their place in the selection, so no two clash.
    const colorOf = g => SERIES[Math.max(0, state.compare.indexOf(g)) % SERIES.length];
    const groupName = g => GROUP_NAMES[g] || g;
    const effName = k => EFFECT_NAMES[k] || NAMES[k] || k.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
    const total = u => Object.values(u.pips).reduce((a, b) => a + b, 0);
    const fmt = (k, v) => PERCENT.test(k) ? `${v > 0 ? "+" : ""}${Math.round(v * 100)}%` : (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, ""));
    const yearOf = level => D.techs.mil[level].year;
    // Value of an effect at every level: the base (from the game's defines)
    // plus every level so far -- except keys a level sets outright.
    const cumulative = (cat, key) => {
      const absolute = D.absolute.includes(key); let s = D.bases[key] || 0;
      return D.techs[cat].map(t => (s = absolute ? (t.effects[key] ?? s) : s + (t.effects[key] || 0)));
    };
    // Units of a group and type (artillery is shared by every group).
    const unitsOf = (group, type) => D.units.filter(u => u.type === type && (type === "artillery" ? !u.group : u.group === group));
    // Best (most total pips) unit available at each mil tech level.
    function bestByLevel(group, type) {
      const units = unitsOf(group, type); let best = null;
      return D.techs.mil.map(t => { for (const u of units) if (u.tech === t.level && (!best || total(u) > total(best))) best = u; return best; });
    }

    // --- Step chart (inline SVG) ------------------------------------------------
    // series: [{ name, color, values: [per level] }]; x = level 0..n-1.
    function chart(series, { height = 170, label = v => v, years = true } = {}) {
      const W = 520, H = height, L = 34, R = 8, T = 8, B = years ? 30 : 18;
      const n = series[0].values.length, all = series.flatMap(s => s.values).filter(v => v != null);
      let lo = Math.min(0, ...all), hi = Math.max(...all); if (hi === lo) hi = lo + 1;
      const x = i => L + (W - L - R) * i / (n - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
      const ticks = [lo, lo + (hi - lo) / 2, hi];
      let g = `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${esc(label(v))}</text>`).join("")}</g>`;
      for (let i = 0; i < n; i += 4) g += `<text x="${x(i)}" y="${H - B + 12}" text-anchor="middle">${i}</text>` + (years ? `<text x="${x(i)}" y="${H - B + 23}" text-anchor="middle">${yearOf(i)}</text>` : "");
      for (const s of series) {
        let d = "", prev = null;
        s.values.forEach((v, i) => { if (v == null) { prev = null; return; } d += prev == null ? `M${x(i)},${y(v)}` : `H${x(i)}V${y(v)}`; prev = v; });
        d += prev != null ? `H${x(n - 1)}` : "";
        g += `<path class="series" d="${d}" style="stroke:var(${s.color})"><title>${esc(s.name)}</title></path>`;
      }
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>` +
        (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:var(${s.color})"></i>${esc(s.name)}</span>`).join("")}</div>` : "");
    }

    // --- Military units tab ----------------------------------------------------
    function pipset(u, prev) {
      const p = u.pips, d = k => prev ? p[k] - prev.pips[k] : 0;
      const cell = (k, cls) => `<b class="${cls}" title="${k.replace(/_/g, " ")}${d(k) ? ` (${d(k) > 0 ? "+" : ""}${d(k)} vs previous best)` : ""}">${p[k]}</b>`;
      return `<span class="pipset">${cell("offensive_fire", "pip-f")}${cell("offensive_shock", "pip-s")}${cell("offensive_morale", "pip-m")}${cell("defensive_fire", "pip-f")}${cell("defensive_shock", "pip-s")}${cell("defensive_morale", "pip-m")}</span>`;
    }
    function lanes(group) {
      const axis = `<div class="axis"><span style="text-align:left">Mil tech / year</span>${D.techs.mil.map(t => `<span title="${t.year}">${t.level}</span>`).join("")}</div>`;
      return `<div class="lanes">${axis}` + TYPES.map(type => {
        const best = bestByLevel(group, type);
        let prevBest = null;
        const rows = unitsOf(group, type).sort((a, b) => a.tech - b.tech || total(b) - total(a)).map(u => {
          const isBest = best.includes(u), gain = isBest && prevBest ? total(u) - total(prevBest) : null;
          const html = `<div class="unit${isBest ? " best" : ""}"><span class="name"><span class="n" title="${esc(u.name)} · maneuver ${u.maneuver}">${esc(u.name)} <small>tech ${u.tech}</small></span>` +
            `${pipset(u, isBest ? prevBest : null)}<span class="total">${total(u)}</span><span class="gain" style="width:2.2em">${gain ? `+${gain}` : ""}</span></span>` +
            `<span class="bar" style="grid-column:${u.tech + 2} / -1" title="Available from mil tech ${u.tech} (${yearOf(u.tech)})"></span></div>`;
          if (isBest) prevBest = u;
          return html;
        }).join("");
        return `<div class="lane-title">${type[0].toUpperCase() + type.slice(1)}${type === "artillery" ? " <small style='color:var(--muted);font-size:0.75em'>(the same for every group)</small>" : ""}</div>${rows}`;
      }).join("") + `<p class="key">Each unit's pips: <span class="pip-f">fire</span> · <span class="pip-s">shock</span> · <span class="pip-m">morale</span>, offensive on top, defensive below; then total pips. Bold units with a red bar are the strongest available from their tech on (most total pips), with <span class="gain">+N</span> pips over the previous one; the bar shows from which mil tech a unit can be recruited.</p></div>`;
    }
    function renderUnits() {
      const pipCharts = TYPES.map(type => `<div class="card"><h3>${type[0].toUpperCase() + type.slice(1)}: best total pips</h3>` +
        chart((type === "artillery" ? ["western"] : state.compare).map((g, i) => ({
          name: type === "artillery" ? "All groups" : groupName(g), color: colorOf(g),
          values: bestByLevel(g, type).map(u => u ? total(u) : null),
        }))) + `</div>`).join("");
      const mult = (keys, title) => `<div class="card"><h3>${title}</h3>` + chart(keys.map((k, i) => ({ name: effName(k), color: SERIES[i], values: cumulative("mil", k) })), { label: v => v.toFixed(1) }) + `</div>`;
      app.innerHTML = `
        <section>
          <h2>How pips evolve</h2>
          <p class="note">The strongest unit a group can recruit at each military tech level, by total pips (fire, shock and morale, offensive and defensive). Pick groups to compare.</p>
          <div class="chips multi" id="compare">${D.groups.map(g => `<button data-g="${g}" class="${state.compare.includes(g) ? "on" : ""}" style="--c:var(${colorOf(g)})">${esc(groupName(g))}</button>`).join("")}</div>
          <div class="grid" style="margin-top:12px">${pipCharts}</div>
        </section>
        <section>
          <h2>What military tech multiplies</h2>
          <p class="note">Pips decide which dice bonuses a unit has; these tech values multiply the damage it deals (and morale, tactics, width) — the same for every group. Cumulative values at each level.</p>
          <div class="grid">
            ${mult(["infantry_fire", "infantry_shock"], "Infantry damage")}
            ${mult(["cavalry_fire", "cavalry_shock"], "Cavalry damage")}
            ${mult(["artillery_fire", "artillery_shock"], "Artillery damage")}
            ${mult(["land_morale", "military_tactics"], "Morale and tactics")}
            ${mult(["combat_width"], "Combat width")}
          </div>
        </section>
        <section>
          <h2>Every unit, by tech</h2>
          <div class="chips" id="group" style="margin-bottom:10px">${D.groups.map(g => `<button data-g="${g}" class="${g === state.group ? "on" : ""}">${esc(groupName(g))}</button>`).join("")}</div>
          ${lanes(state.group)}
        </section>`;
    }

    // --- Adm / Dip / Mil tab -----------------------------------------------------
    function renderTech() {
      const CAT = { adm: "Administrative", dip: "Diplomatic", mil: "Military" };
      const sections = Object.entries(CAT).map(([cat, title]) => {
        const keys = [...new Set(D.techs[cat].flatMap(t => Object.keys(t.effects)))].filter(k => k !== "sprite_level");
        const cards = keys.map(k => {
          const v = cumulative(cat, k);
          return `<div class="card"><h3>${esc(effName(k))} <small style="color:var(--muted);font-size:0.75em">${fmt(k, v.at(-1))} at tech ${v.length - 1}</small></h3>` +
            chart([{ name: effName(k), color: "--s1", values: v }], { height: 120, label: x => fmt(k, +x.toFixed(2)) }) + `</div>`;
        }).join("");
        const rows = D.techs[cat].map(t => {
          const eff = Object.entries(t.effects).filter(([k]) => k !== "sprite_level").map(([k, v]) => `<span class="tag eff">${esc(effName(k))} ${v > 0 && !PERCENT.test(k) ? "+" : ""}${fmt(k, v)}</span>`).join("");
          const un = [...t.enables, ...t.flags].map(k => `<span class="tag">${esc(NAMES[k] || k.replace(/_/g, " "))}</span>`);
          const shownUnlocks = un.length > 14 ? un.slice(0, 14).join("") + `<span class="tag">+${un.length - 14} more</span>` : un.join("");
          return `<tr><td class="num">${t.level}</td><td class="num">${t.year}</td><td>${eff}</td><td>${shownUnlocks}</td></tr>`;
        }).join("");
        return `<section><h2>${title} technology</h2>
          <p class="note">The value a country has at each level — what the level adds on top of everything before it, starting from the game's base value (e.g. combat width 15, governing capacity 200) — by the year the game expects that level.</p>
          <div class="grid">${cards}</div>
          <details style="margin-top:12px"><summary>Every ${title.toLowerCase()} level</summary>
            <table class="levels"><tr><th>Level</th><th>Year</th><th>Adds</th><th>Unlocks</th></tr>${rows}</table></details>
        </section>`;
      }).join("");
      app.innerHTML = sections;
    }

    function render() {
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
      renderSide();
      ({ units: renderUnits, tech: renderTech, country: renderCountry })[state.tab]();
      writeHash();
    }

    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.tab = b.dataset.tab; render(); } });
    // --- Countries ----------------------------------------------------------------------------------
    // Hash: #units, #tech, #TAG, #TAG/missions, #TAG/ideas, with the start date as a last part (#FRA/overview/1492.1.1).
    function readHash() {
      const [a, sec, date] = decodeURIComponent(location.hash.slice(1)).split("/");
      if (a === "units" || a === "tech") state.tab = a;
      else if (a && cBy[a]) { state.tab = "country"; state.tag = a; state.section = ["overview", "missions", "ideas"].includes(sec) ? sec : "overview"; }
      if (CD) state.date = date && CD.dates.includes(date) ? date : CD.dates[0];
    }
    function writeHash() {
      const h = state.tab === "country" && state.tag ? [state.tag, state.section, state.date !== CD?.dates[0] ? state.date : ""].join("/").replace(/\/+$/, "") : state.tab === "country" ? "" : state.tab;
      if (location.hash.slice(1) !== h) history.replaceState(null, "", h ? "#" + h : location.pathname);
    }
    const devOf = a => a ? a.tax + a.prod + a.man : 0;
    const dateLabel = d => d.split(".")[0];
    const at = c => c?.at[state.date];
    const nm = k => CD.names[k] || (k || "").replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
    const cname = tag => cBy[tag]?.name || tag;
    const link = tag => cBy[tag] ? `<a class="tagl" data-tag="${tag}">${esc(cname(tag))}</a>` : esc(tag);
    const links = tags => tags.length ? tags.map(link).join('<span class="sep">, </span>') : '<span style="color:var(--muted)">none</span>';

    function renderSide() {
      if (!CD) return;
      const q = (document.getElementById("csearch").value || "").trim().toLowerCase();
      const list = CD.countries.filter(c => q ? (c.name + " " + c.tag).toLowerCase().includes(q) : c.at[state.date]);
      document.getElementById("sideHint").textContent = q ? `${list.length} matching (dimmed ones don't exist in ${dateLabel(state.date)})` : `${list.length} countries in ${dateLabel(state.date)}, by development`;
      const box = document.getElementById("countries"), top = box.scrollTop;
      box.innerHTML = list.slice(0, 400).map(c => `<div class="country${c.tag === state.tag ? " pinned" : ""}${c.at[state.date] ? "" : " later"}" data-tag="${c.tag}" role="button" tabindex="0">${c.flag ? `<img src="flags/${c.tag}.png" alt="" loading="lazy">` : "<span></span>"}<span class="name">${esc(c.name)}</span><span class="count" title="Total development">${c.at[state.date] ? devOf(c.at[state.date]) : ""}</span></div>`).join("") || '<p class="note">No country matches.</p>';
      box.scrollTop = top;
    }
    function pick(tag) {
      state.tag = tag; state.tab = "country";
      document.getElementById("side").classList.remove("open");
      render(); window.scrollTo({ top: 0 });
    }
    const loadJson = url => fetch(url).then(r => { if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.json(); });

    const MONTHS = null;
    function bar(label, value, max, cls = "") { return `<div class="bar-row"><span>${esc(label)}</span><span class="b ${cls}" style="width:${Math.max(2, 100 * value / (max || 1))}%"></span><span>${value}</span></div>`; }
    function renderCountry() {
      if (!CD) { app.innerHTML = '<p class="note">Loading countries…</p>'; return; }
      const c = cBy[state.tag];
      if (!c) {
        app.innerHTML = `<section><h2>Countries</h2><p class="note">Pick a country on the left to see how it starts: its ruler and their monarch points, provinces and development, rivals, allies and subjects, national ideas and mission trees, at any of the game's start dates.</p></section>`;
        return;
      }
      const a = at(c);
      const head = `<div class="chead">${c.flag ? `<img src="flags/${c.tag}.png" alt="">` : ""}<div><h2>${esc(c.name)}</h2><div class="sub">${c.tag} · ${a ? `${esc(nm(a.government))}${a.rank ? ` · rank ${a.rank}` : ""} · ${esc(nm(a.religion))} · ${esc(nm(a.culture))}` : `doesn't exist at the ${dateLabel(state.date)} start`}</div></div></div>`;
      const sections = `<div class="chips sections" id="sections">${[["overview", "Overview"], ["missions", "Mission trees"], ["ideas", "National ideas"]].map(([k, t]) => `<button data-sec="${k}" class="${state.section === k ? "on" : ""}">${t}</button>`).join("")}</div>`;
      app.innerHTML = head + sections + '<div id="cbody"></div>';
      const body = document.getElementById("cbody");
      if (state.section === "missions") return renderMissions(c, body);
      if (state.section === "ideas") return renderIdeas(c, body);
      if (!a) { body.innerHTML = `<p class="note">${esc(c.name)} has no provinces at this start. Pick another date on the left.</p>`; return; }
      const grp = CD.tech_groups[a.tech_group], dev = devOf(a), tot = a.tax + a.prod + a.man || 1;
      const person = (p, role) => p ? `<div class="stat"><div class="k">${role}</div><div class="v">${esc(p.name || "Unnamed")}</div><div class="s">${p.dynasty ? esc(p.dynasty) + " · " : ""}${p.born ? `born ${p.born}${state.date ? `, ${parseInt(state.date) - p.born} years old` : ""}` : ""}</div>${p.adm != null ? `<div class="mana" title="administrative / diplomatic / military"><b class="a">${p.adm}</b><b class="d">${p.dip}</b><b class="m">${p.mil}</b></div><div class="s">${p.adm + p.dip + p.mil} points in total</div>` : ""}</div>` : "";
      const goods = a.goods.map(([g, d]) => bar(nm(g), d, a.goods[0][1])).join("");
      const faiths = a.religions.map(([r, d]) => bar(nm(r), d, a.religions[0][1])).join("");
      body.innerHTML = `
        <div class="stats">
          <div class="stat"><div class="k">Provinces</div><div class="v">${a.provinces}</div><div class="s">${a.cities} cities${a.hre ? ` · ${a.hre} in the HRE` : ""}</div></div>
          <div class="stat"><div class="k">Development</div><div class="v">${dev}</div><div class="s"><span style="color:var(--fire)">${a.tax} tax</span> · <span style="color:var(--shock)">${a.prod} production</span> · <span style="color:var(--morale)">${a.man} manpower</span></div></div>
          ${person(a.ruler, "Ruler")}${person(a.heir, "Heir")}
          <div class="stat"><div class="k">Capital</div><div class="v">${esc(a.capital || "–")}</div><div class="s">${esc(nm(a.government))}</div></div>
          <div class="stat"><div class="k">Technology</div><div class="v">${esc(grp ? grp.name : nm(a.tech_group))}</div><div class="s">${grp && grp.start_level != null && state.date === CD.dates[0] ? `adm, dip and mil tech all start at level ${grp.start_level} · ` : ""}<a class="tagl" data-unitgroup="${esc(grp ? grp.unit_type : a.tech_group)}">its military units</a></div></div>
        </div>
        <div class="cols">
          <div class="card"><h3>Development split</h3><div class="bars">${bar("Base tax", a.tax, Math.max(a.tax, a.prod, a.man), "t")}${bar("Base production", a.prod, Math.max(a.tax, a.prod, a.man), "p")}${bar("Base manpower", a.man, Math.max(a.tax, a.prod, a.man), "m")}</div><p class="note" style="margin:8px 0 0">${Math.round(100 * a.tax / tot)}% / ${Math.round(100 * a.prod / tot)}% / ${Math.round(100 * a.man / tot)}% of ${dev}.</p></div>
          <div class="card"><h3>Trade goods (by development)</h3><div class="bars">${goods || "–"}</div></div>
          <div class="card"><h3>Religions (by development)</h3><div class="bars">${faiths || "–"}</div></div>
          <div class="card"><h3>Diplomacy at the start</h3><dl class="facts tags">
            ${a.overlord ? `<dt>Subject of</dt><dd>${link(a.overlord.tag)} <span style="color:var(--muted)">(${esc(nm(a.overlord.type))})</span></dd>` : ""}
            ${a.subjects.length ? `<dt>Subjects</dt><dd>${a.subjects.map(x => `${link(x.tag)} <span style="color:var(--muted)">(${esc(nm(x.type))})</span>`).join(", ")}</dd>` : ""}
            <dt>Allies</dt><dd>${links(a.allies)}</dd>
            ${a.guarantees.length ? `<dt>Guarantees</dt><dd>${links(a.guarantees)}</dd>` : ""}
            ${a.marriages.length ? `<dt>Royal marriages</dt><dd>${links(a.marriages)}</dd>` : ""}
            <dt>Historical rivals</dt><dd>${links(a.rivals)}</dd>
            <dt>Historical friends</dt><dd>${links(a.friends)}</dd></dl></div>
          <div class="card"><h3>Government and culture</h3><dl class="facts">
            <dt>Government</dt><dd>${esc(nm(a.government))}</dd>
            ${a.reforms.length ? `<dt>Reforms</dt><dd>${a.reforms.map(r => esc(nm(r))).join(", ")}</dd>` : ""}
            <dt>Primary culture</dt><dd>${esc(nm(a.culture))}</dd>
            ${a.accepted.length ? `<dt>Accepted</dt><dd>${a.accepted.map(r => esc(nm(r))).join(", ")}</dd>` : ""}
            <dt>Religion</dt><dd>${esc(nm(a.religion))}</dd></dl></div>
        </div>
        <p class="note" style="margin-top:12px">Armies and fleets aren't listed: the game builds each country's starting forces from its force limit when a campaign begins, rather than reading them from a file.</p>`;
    }

    // --- Missions and ideas (loaded when first opened) ---------------------------------------------------
    const MW = 160, MH = 52, MDX = 176, MDY = 76;
    let missionSel = null;
    async function renderMissions(c, body) {
      body.innerHTML = '<p class="note">Loading…</p>';
      try { MD ||= await loadJson("missions.json"); } catch (e) { body.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
      const ids = MD.by_tag[c.tag] || [];
      if (!ids.length) { body.innerHTML = `<p class="note">${esc(c.name)} has no mission trees of its own in the game files (it may use the generic ones, which aren't listed here).</p>`; return; }
      body.innerHTML = `<p class="note">${esc(c.name)}'s mission trees for a player with every DLC. Branches the game picks between depending on the campaign (for example the Holy Roman Empire paths) are all shown. Click a mission for its text.</p>` +
        ids.map((id, i) => {
          const t = MD.trees[id], ms = t.missions, by = Object.fromEntries(ms.map(m => [m.key, m]));
          const W = (Math.max(...ms.map(m => m.x)) + 1) * MDX + 16, H = (Math.max(...ms.map(m => m.y)) + 1) * MDY + 8;
          const edges = ms.flatMap(m => m.req.filter(r => by[r]).map(r => { const p = by[r], x1 = 8 + p.x * MDX + MW / 2, y1 = 4 + p.y * MDY + MH, x2 = 8 + m.x * MDX + MW / 2, y2 = 4 + m.y * MDY, my = (y1 + y2) / 2; return `<path class="medge" d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}"/>`; })).join("");
          const nodes = ms.map(m => `<g class="mnode${m.key === missionSel ? " sel" : ""}" data-m="${m.key}" transform="translate(${8 + m.x * MDX} ${4 + m.y * MDY})"><rect width="${MW}" height="${MH}"/>${wrap(m.title, 24).map((l, j) => `<text x="${MW / 2}" y="${20 + j * 13}">${esc(l)}</text>`).join("")}</g>`).join("");
          return `<div class="tree-wrap"><h3>Tree ${i + 1} · ${ms.length} missions</h3><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Mission tree ${i + 1}">${edges}${nodes}</svg></div>`;
        }).join("") + `<div id="mdetail" hidden></div>`;
      showMission();
    }
    function wrap(text, n) { const out = []; let line = ""; for (const w of text.split(" ")) { if ((line + " " + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + " " + w).trim(); } out.push(line); return out.slice(0, 3); }
    function showMission() {
      const box = document.getElementById("mdetail"); if (!box) return;
      const m = missionSel && Object.values(MD.trees).flatMap(t => t.missions).find(x => x.key === missionSel);
      box.hidden = !m;
      if (m) box.innerHTML = `<h3 style="margin-bottom:2px">${esc(m.title)}</h3>${m.desc ? `<p style="font-size:0.92em">${esc(m.desc)}</p>` : '<p class="note">No description in the game files.</p>'}${m.req.length ? `<p class="note" style="margin:4px 0 0">Requires: ${m.req.map(r => esc((Object.values(MD.trees).flatMap(t => t.missions).find(x => x.key === r) || {}).title || r)).join(", ")}</p>` : ""}`;
    }
    const modText = m => m.flag ? esc(m.label) : `${m.value > 0 ? "+" : ""}${m.kind === "percent" ? Math.round(m.value * 1000) / 10 + "%" : Math.round(m.value * 100) / 100} ${esc(m.label)}`;
    async function renderIdeas(c, body) {
      body.innerHTML = '<p class="note">Loading…</p>';
      try { ID ||= await loadJson("ideas.json"); } catch (e) { body.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
      const g = ID.by_tag[c.tag];
      if (!g) { body.innerHTML = `<p class="note">${esc(c.name)} has no national ideas of its own in the game files; it picks from the generic idea groups.</p>`; return; }
      const list = ms => ms.length ? `<ul>${ms.map(m => `<li>${modText(m)}</li>`).join("")}</ul>` : "";
      body.innerHTML = `<h2 style="margin-bottom:4px">${esc(g.name)}</h2><p class="note">Which modifiers are percentages is a best guess, since the game doesn't list that in a file.</p>
        <div class="cols"><div class="idea"><h3>Traditions</h3>${list(g.start)}</div><div class="idea"><h3>Ambition</h3>${list(g.bonus)}</div>
        ${g.ideas.map((i, n) => `<div class="idea"><h3>${esc(i.name)} <span class="n">idea ${n + 1}</span></h3>${i.desc ? `<div class="d">${esc(i.desc)}</div>` : ""}${list(i.mods)}</div>`).join("")}</div>`;
    }

    document.getElementById("side").addEventListener("click", e => { const r = e.target.closest("[data-tag]"); if (r) pick(r.dataset.tag); });
    document.getElementById("csearch").addEventListener("input", renderSide);
    document.getElementById("dateSel").addEventListener("change", e => { state.date = e.target.value; render(); });
    document.getElementById("pickBtn").addEventListener("click", () => document.getElementById("side").classList.toggle("open"));
    app.addEventListener("click", e => {
      const t = e.target.closest("[data-tag]"); if (t) { pick(t.dataset.tag); return; }
      const sec = e.target.closest("[data-sec]"); if (sec) { state.section = sec.dataset.sec; render(); return; }
      const m = e.target.closest("[data-m]"); if (m) { missionSel = m.dataset.m === missionSel ? null : m.dataset.m; document.querySelectorAll(".mnode").forEach(n => n.classList.toggle("sel", n.dataset.m === missionSel)); showMission(); return; }
      const ug = e.target.closest("[data-unitgroup]"); if (ug) { if (D.groups.includes(ug.dataset.unitgroup)) state.group = ug.dataset.unitgroup; state.tab = "units"; render(); window.scrollTo({ top: 0 }); return; }
      const c = e.target.closest("#compare button"), g = e.target.closest("#group button");
      if (c) { const k = c.dataset.g; state.compare = state.compare.includes(k) ? state.compare.filter(x => x !== k) : [...state.compare, k]; if (!state.compare.length) state.compare = [k]; render(); }
      if (g) { state.group = g.dataset.g; render(); }
    });

    Promise.all([
      fetch("data.json?v=" + Date.now()).then(r => { if (!r.ok) throw new Error(`data.json: HTTP ${r.status}`); return r.json(); }),
      loadJson("countries.json").catch(() => null), // the tech pages work without it
    ]).then(([data, countries]) => {
      D = data; NAMES = data.names || {};
      for (const u of D.units) NAMES[u.id] ??= u.name;
      document.getElementById("version").textContent = data.game_version ? `game ${data.game_version}` : "";
      if (data.game_version) document.getElementById("footVersion").textContent = ` (version ${data.game_version})`;
      if (countries) {
        CD = countries;
        for (const c of CD.countries) cBy[c.tag] = c;
        state.date = CD.dates[0];
        document.getElementById("dateSel").innerHTML = CD.dates.map(d => `<option value="${d}">${d.split(".")[0]}${d === CD.dates[0] ? " (default start)" : ""} – ${d}</option>`).join("");
        readHash();
      } else {
        document.getElementById("side").remove(); document.getElementById("pickBtn").remove(); document.querySelector('[data-tab="country"]').remove();
        document.querySelector(".layout").style.display = "block";
      }
      if (CD) document.getElementById("dateSel").value = state.date;
      window.addEventListener("hashchange", () => { readHash(); if (CD) document.getElementById("dateSel").value = state.date; render(); });
      render();
    }).catch(e => { app.innerHTML = `<p class="err">Couldn't load the data (${esc(e.message)}). Run <code>ruby eu4tech/extract.rb</code> first.</p>`; });
  </script>
</body>
</html>
